
name: SeaLights Test Execution

on:
  workflow_dispatch:
    inputs:
      selection_json:
        description: "Module 6 test selection JSON"
        required: true
        type: string

permissions:
  contents: read

jobs:

  execute-selected-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Create test selection file
        shell: bash
        env:
          SELECTION_JSON: ${{ inputs.selection_json }}
        run: |
          python -c "import os; from pathlib import Path; Path('sealights_selection.json').write_text(os.environ['SELECTION_JSON'], encoding='utf-8')"

      - name: Execute selected tests
        run: |
          python .github/scripts/sealights_runner.py

      - name: Upload execution reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sealights-execution-report
          path: execution_output/
          if-no-files-found: warn
          retention-days: 14
